services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    command:
      [
        "sh",
        "-ec",
        "npm ci --no-audit --no-fund && exec npx nodemon --legacy-watch --watch server.js server.js",
      ]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      base44.project: "Thumbnail Studio"
      base44.kind: web
      base44.port: 3000
